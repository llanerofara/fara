<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llanero Fara Fara - Enlaces Oficiales</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Montserrat & Rajdhani -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #030303;
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* 1. Fondo Cuadrícula Diagonal Animada Grande */
        .bg-grid-diagonal {
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            background-image: 
                linear-gradient(to right, rgba(212, 175, 55, 0.12) 1.5px, transparent 1.5px),
                linear-gradient(to bottom, rgba(212, 175, 55, 0.12) 1.5px, transparent 1.5px);
            background-size: 90px 90px;
            animation: gridMove 10s linear infinite;
            transform: rotate(-15deg);
            pointer-events: none;
        }

        @keyframes gridMove {
            0% {
                transform: rotate(-15deg) translate(0, 0);
            }
            100% {
                transform: rotate(-15deg) translate(90px, 90px);
            }
        }

        /* 2. Resplandor con Efecto Flicker */
        .ambient-glow-flicker {
            position: fixed;
            top: 22%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 550px;
            height: 550px;
            background: radial-gradient(circle, rgba(230, 180, 50, 0.28) 0%, rgba(212, 175, 55, 0.08) 45%, rgba(0, 0, 0, 0) 70%);
            pointer-events: none;
            z-index: 1;
            animation: flickerLight 4s infinite alternate;
        }

        @keyframes flickerLight {
            0%, 100% { opacity: 0.95; filter: drop-shadow(0 0 15px rgba(212, 175, 55, 0.3)); }
            8% { opacity: 0.4; }
            10% { opacity: 0.9; }
            12% { opacity: 0.3; }
            14% { opacity: 0.95; }
            30% { opacity: 1; }
            55% { opacity: 0.5; }
            57% { opacity: 0.85; }
            78% { opacity: 0.95; }
            82% { opacity: 0.25; }
            84% { opacity: 0.9; }
        }

        /* 3. Animaciones Secuenciales de Entrada */
        @keyframes fadeInUpSmooth {
            0% {
                opacity: 0;
                transform: translateY(50px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .anim-member-1 {
            animation: fadeInUpSmooth 1s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        .anim-member-2 {
            animation: fadeInUpSmooth 1s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
        }

        .anim-member-3 {
            animation: fadeInUpSmooth 1s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
            opacity: 0;
        }

        .anim-logo {
            animation: fadeInUpSmooth 1s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
            opacity: 0;
        }

        .anim-links {
            animation: fadeInUpSmooth 1s cubic-bezier(0.16, 1, 0.3, 1) 1.4s forwards;
            opacity: 0;
        }

        /* Fusionado Limpio de las Imagenes Sin Bordes */
        .member-img-blend {
            mix-blend-mode: lighten;
            filter: contrast(1.12) brightness(1.08);
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
        }

        /* 4. Partículas de Fuego Sutiles en la Base */
        .fire-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 220px;
            pointer-events: none;
            z-index: 2;
            overflow: hidden;
            mask-image: linear-gradient(to top, rgba(0,0,0,1) 25%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 25%, rgba(0,0,0,0) 100%);
        }

        .fire-spark {
            position: absolute;
            bottom: -20px;
            background: radial-gradient(circle, rgba(255, 200, 50, 0.9) 0%, rgba(240, 100, 20, 0.6) 50%, rgba(200, 50, 10, 0) 80%);
            border-radius: 50%;
            animation: riseSpark 1.8s infinite ease-in;
            box-shadow: 0 0 8px rgba(255, 165, 0, 0.6);
        }

        @keyframes riseSpark {
            0% {
                transform: translateY(0) translateX(0) scale(0.6);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-200px) translateX(var(--tx)) scale(1.2);
                opacity: 0;
            }
        }

        .spark-1 { left: 10%; width: 6px; height: 6px; animation-duration: 1.4s; animation-delay: 0s; --tx: 15px; }
        .spark-2 { left: 25%; width: 4px; height: 4px; animation-duration: 1.9s; animation-delay: 0.4s; --tx: -20px; }
        .spark-3 { left: 40%; width: 7px; height: 7px; animation-duration: 1.2s; animation-delay: 0.2s; --tx: 25px; }
        .spark-4 { left: 55%; width: 5px; height: 5px; animation-duration: 2.0s; animation-delay: 0.7s; --tx: -15px; }
        .spark-5 { left: 70%; width: 4px; height: 4px; animation-duration: 1.5s; animation-delay: 0.3s; --tx: 10px; }
        .spark-6 { left: 85%; width: 6px; height: 6px; animation-duration: 1.7s; animation-delay: 0.6s; --tx: -25px; }
        .spark-7 { left: 20%; width: 5px; height: 5px; animation-duration: 1.8s; animation-delay: 0.9s; --tx: 30px; }
        .spark-8 { left: 50%; width: 4px; height: 4px; animation-duration: 1.3s; animation-delay: 0.5s; --tx: -10px; }
        .spark-9 { left: 80%; width: 7px; height: 7px; animation-duration: 1.6s; animation-delay: 0.1s; --tx: 18px; }

        .gold-text-glow {
            text-shadow: 0 0 12px rgba(212, 175, 55, 0.5);
        }

        /* ==========================================================================
           5. NUEVO ESTILO ULTRA VISTOSO PARA BOTONES (WHATSAPP Y REDES SOCIALES)
           ========================================================================== */
        
        /* Contenedor base de la tarjeta */
        .btn-card-vibrant {
            position: relative;
            overflow: hidden;
            border-radius: 1rem;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(16px);
        }

        /* Efecto de barrido / brillo diagonal (Shimmer Continuous) */
        .btn-card-vibrant::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 50%;
            height: 200%;
            background: linear-gradient(
                to right,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.35) 50%,
                rgba(255, 255, 255, 0) 100%
            );
            transform: rotate(25deg);
            animation: continuousShimmer 4s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes continuousShimmer {
            0% { left: -70%; }
            20% { left: 130%; }
            100% { left: 130%; }
        }

        /* Transición de elevación en Hover */
        .btn-card-vibrant:hover {
            transform: translateY(-5px) scale(1.03);
        }

        /* Pulsación sutil de respiración */
        .pulse-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.015); }
        }

        /* --- BOTÓN WHATSAPP VIBRANTE --- */
        .btn-whatsapp {
            background: linear-gradient(135deg, #052e16 0%, #15803d 50%, #22c55e 100%);
            border: 2px solid #4ade80;
            box-shadow: 0 8px 25px -4px rgba(34, 197, 94, 0.5), 
                        0 0 20px 2px rgba(34, 197, 94, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn-whatsapp:hover {
            box-shadow: 0 14px 35px -2px rgba(34, 197, 94, 0.8), 
                        0 0 30px 6px rgba(74, 222, 128, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border-color: #86efac;
        }

        /* --- BOTÓN FACEBOOK METÁLICO Y AZUL BRILLANTE --- */
        .btn-facebook {
            background: linear-gradient(135deg, #0a192f 0%, #1e40af 50%, #3b82f6 100%);
            border: 2px solid #60a5fa;
            box-shadow: 0 8px 25px -4px rgba(59, 130, 246, 0.5), 
                        0 0 20px 2px rgba(59, 130, 246, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
        }
        .btn-facebook:hover {
            box-shadow: 0 14px 35px -2px rgba(59, 130, 246, 0.8), 
                        0 0 30px 6px rgba(96, 165, 250, 0.6),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border-color: #93c5fd;
        }

        /* --- BOTÓN TIKTOK NEÓN CYAN & MAGENTA --- */
        .btn-tiktok {
            background: linear-gradient(135deg, #000000 0%, #111827 40%, #00f2fe 100%);
            border: 2px solid #ff0050;
            box-shadow: 0 8px 25px -4px rgba(255, 0, 80, 0.5), 
                        0 0 20px 2px rgba(0, 242, 254, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }
        .btn-tiktok:hover {
            box-shadow: 0 14px 35px -2px rgba(255, 0, 80, 0.8), 
                        0 0 30px 6px rgba(0, 242, 254, 0.7),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            border-color: #00f2fe;
        }

        /* Sombras de texto e iconos para máxima legibilidad */
        .text-glow-strong {
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(255, 255, 255, 0.4);
        }

        .icon-box-shadow {
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
        }

        /* Insignia "ÚNICO CONTACTO" */
        .badge-verified {
            background: linear-gradient(90deg, #f59e0b, #fbbf24);
            color: #000;
            font-weight: 900;
            font-size: 0.65rem;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            border-radius: 9999px;
            box-shadow: 0 0 8px rgba(251, 191, 36, 0.8);
        }
    </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen px-4 pt-0 pb-6 relative">

                <img src="llanerosocial.png" alt="Llanero Fara Fara Logo" class="w-72 md:w-80 drop-shadow-[0_10px_20px_rgba(0,0,0,0.9)]" onerror="this.onerror=null; this.src='https://placehold.co/600x200/000/ffffff?text=LLANERO+FARA+FARA'">

        <!-- SECCIÓN DE ENLACES Y CONTACTOS VISTOSOS -->
        <section class="anim-links w-full space-y-5 px-2 mt-2">

                        </div>

                            </div>
                            <span class="font-black text-xl tracking-tight text-white text-glow-strong block">844 603 9000</span>
                        </div>
                    </div>
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-white/20 border border-white/30 text-white group-hover:bg-white group-hover:text-emerald-700 transition-all shadow-lg">
                        <i class="fa-solid fa-arrow-right text-base group-hover:translate-x-0.5 transition-transform"></i>
                    </div>
                </a>
            </div>

            <!-- 2. FACEBOOK OFICIAL -->
            <a href="https://facebook.com/llanerofarafara" target="_blank" rel="noopener noreferrer" class="btn-card-vibrant btn-facebook flex items-center justify-between p-4 group">
                <div class="flex items-center space-x-4">
                    <div class="w-13 h-13 w-12 h-12 rounded-2xl bg-white/15 backdrop-blur-md border border-white/30 flex items-center justify-center text-white icon-box-shadow group-hover:scale-110 group-hover:-rotate-6 transition-transform duration-300">

            <!-- 3. TIKTOK OFICIAL -->
            <a href="https://tiktok.com/@llanerofara" target="_blank" rel="noopener noreferrer" class="btn-card-vibrant btn-tiktok flex items-center justify-between p-4 group">
                <div class="flex items-center space-x-4">

                    <div class="text-left">

        </section>

        <!-- PIE DE PÁGINA -->

            <p class="text-xs text-zinc-400 font-semibold tracking-wider drop-shadow-md">

    </main>

    <!-- EFECTO DE PARTÍCULAS DE FUEGO EN LA BASE -->

        <div class="fire-spark spark-1"></div>
        <div class="fire-spark spark-2"></div>
        <div class="fire-spark spark-3"></div>
        <div class="fire-spark spark-4"></div>
        <div class="fire-spark spark-5"></div>
        <div class="fire-spark spark-6"></div>
        <div class="fire-spark spark-7"></div>
        <div class="fire-spark spark-8"></div>
        <div class="fire-spark spark-9"></div>
    </div>

</body>
